    <!--
      The one loading screen. It is here rather than in React so it paints before
      any script has loaded, and stays the same element until src/lib/bootSplash.ts
      takes it away. No words, because the fonts aren't in yet.
    -->
    <style>
      html, body { margin: 0; background: #fff; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 10000;
        display: flex; align-items: center; justify-content: center;
        background: #fff; transition: opacity 160ms ease-out;
      }
      #boot-splash[hidden] { display: none; }
      #boot-splash.is-done { opacity: 0; pointer-events: none; }
      .boot-logo {
        display: flex; align-items: center; justify-content: center;
        width: 64px; height: 64px; border-radius: 18px;
        background: linear-gradient(135deg, #6EA4E7, #3A74C2);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.82; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo { animation: none; }
        #boot-splash { transition: none; }
      }
    </style>
    <noscript><style>#boot-splash { display: none; }</style></noscript>

    <!--
      Runs before React mounts so an Arabic user never sees a left-to-right flash.
      The LanguageProvider applies the same values again on mount and on every change.
      Keys must stay in sync with LANG_STORAGE_KEY (src/i18n.ts) and
      FF_LANGUAGE_SWITCHER (src/lib/featureFlags.ts).

      It is also where ?ff_lang= is captured. The language switcher is released,
      so that flag no longer gates anything, but a flag has to be readable before
      any module loads — otherwise this script and React could disagree and the
      page would flip direction twice on load.
    -->
    <script>
      (function () {
        try {
          var ff = new URLSearchParams(window.location.search).get('ff_lang');
          if (ff === '1' || ff === '0') localStorage.setItem('hc_ff_lang', ff);

          // The login page has no language control, so it stays English —
          // matching PRE_AUTH_PATHS in src/lib/LanguageContext.tsx. Applying
          // Arabic here would flash right-to-left before React corrects it.
          if (window.location.pathname !== '/login' &&
              localStorage.getItem('hc_lang') === 'ar') {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
          }
        } catch (e) { /* storage blocked — fall back to the static lang="en" */ }

        // One time only: nothing registers a service worker today, but a browser that
        // kept one from an older deployment could go on serving that build.
        try {
          if ('serviceWorker' in navigator && !localStorage.getItem('hc_sw_cleared')) {
            var controlled = !!navigator.serviceWorker.controller;
            navigator.serviceWorker.getRegistrations()
              .then(function (registrations) {
                return Promise.all(registrations.map(function (r) { return r.unregister(); }));
              })
              .then(function () {
                if (!window.caches) return null;
                return caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (key) { return caches.delete(key); }));
                });
              })
              .then(function () {
                localStorage.setItem('hc_sw_cleared', '1');
                if (controlled) location.reload();
              });
          }
        } catch (e) { /* no storage or no workers: nothing to clear */ }
      })();
    </script>
