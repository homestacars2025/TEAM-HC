<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4ba6ea" />
    <meta
      name="description"
      content="HomestaCars Team Portal — fleet, bookings and operations dashboard."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!--
      Cairo — the same Arabic face homestacars.com uses, at the same five weights,
      so the dashboard and the public site read as one brand. Latin text keeps the
      system stack; index.css only switches to this family under html[dir="rtl"].

      Served from the Google CDN for now. Self-hosting the woff2 subsets (as the
      site does) would drop a third-party request and stop shipping the font to
      English-only users — deferred as a performance pass.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Runs before React mounts so an Arabic user never sees a left-to-right flash.
      The LanguageProvider applies the same values again on mount and on every change.
      Keys must stay in sync with LANG_STORAGE_KEY (src/i18n.ts) and
      FF_LANGUAGE_SWITCHER (src/lib/featureFlags.ts).

      It is also where ?ff_lang= is captured. The language switcher is released,
      so that flag no longer gates anything, but a flag has to be readable before
      any module loads — otherwise this script and React could disagree and the
      page would flip direction twice on load.
    -->
    <script>
      (function () {
        try {
          var ff = new URLSearchParams(window.location.search).get('ff_lang');
          if (ff === '1' || ff === '0') localStorage.setItem('hc_ff_lang', ff);

          // The login page has no language control, so it stays English —
          // matching PRE_AUTH_PATHS in src/lib/LanguageContext.tsx. Applying
          // Arabic here would flash right-to-left before React corrects it.
          if (window.location.pathname !== '/login' &&
              localStorage.getItem('hc_lang') === 'ar') {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
          }
        } catch (e) { /* storage blocked — fall back to the static lang="en" */ }
      })();
    </script>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>HomestaCars Team Portal</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
